<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG Chat</title>

  <!-- Font: Inter (free, Claude-adjacent feel) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Markdown renderer -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    /* ─────────────────────────────────────────────────────────────
       DESIGN TOKENS — default (Claude warm)
       Other themes defined below override these via [data-theme="..."]
       ───────────────────────────────────────────────────────────── */
    :root, [data-theme="claude"] {
      --bg-image:    none;
      --bg:          #faf9f7;
      --surface:     #ffffff;
      --surface-2:   #f0ede6;
      --user-bg:     #ece9e1;
      --text:        #1f1e1d;
      --text-muted:  #6b6864;
      --text-faint:  #95918b;
      --accent:      #d97757;
      --accent-hover:#c45f3f;
      --border:      #e6e2d8;
      --shadow:      0 1px 2px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.04);
    }

    /* ───────── PURPLE-BLACK GRADIENT ───────── */
    [data-theme="purple"] {
      --bg-image:    linear-gradient(135deg, #1a0033 0%, #0a0014 50%, #2d0052 100%);
      --bg:          #14002b;
      --surface:     rgba(45, 20, 75, 0.55);
      --surface-2:   rgba(60, 30, 95, 0.5);
      --user-bg:     rgba(140, 80, 220, 0.25);
      --text:        #f0e8ff;
      --text-muted:  #b8a8d8;
      --text-faint:  #8678a8;
      --accent:      #b070ff;
      --accent-hover:#9050e8;
      --border:      rgba(160, 100, 240, 0.25);
      --shadow:      0 4px 24px rgba(120, 60, 220, 0.25);
    }

    /* ───────── CYBER NEON (black + cyan) ───────── */
    [data-theme="cyber"] {
      --bg-image:    radial-gradient(ellipse at top, #0a1a2e 0%, #000814 70%);
      --bg:          #000814;
      --surface:     rgba(15, 30, 50, 0.6);
      --surface-2:   rgba(20, 40, 70, 0.5);
      --user-bg:     rgba(0, 200, 255, 0.18);
      --text:        #e0f7ff;
      --text-muted:  #80b8d0;
      --text-faint:  #5080a0;
      --accent:      #00e0ff;
      --accent-hover:#00b8d8;
      --border:      rgba(0, 200, 255, 0.25);
      --shadow:      0 0 24px rgba(0, 200, 255, 0.2);
    }

    /* ───────── DEEP OCEAN (navy + teal) ───────── */
    [data-theme="ocean"] {
      --bg-image:    linear-gradient(160deg, #0a1929 0%, #0d2438 50%, #051426 100%);
      --bg:          #0a1929;
      --surface:     rgba(20, 45, 70, 0.6);
      --surface-2:   rgba(25, 55, 85, 0.55);
      --user-bg:     rgba(60, 180, 200, 0.18);
      --text:        #e8f4f8;
      --text-muted:  #98c0d0;
      --text-faint:  #5d8090;
      --accent:      #3dd5e0;
      --accent-hover:#28b8c4;
      --border:      rgba(80, 180, 200, 0.22);
      --shadow:      0 4px 24px rgba(0, 100, 130, 0.3);
    }

    /* ───────── SUNSET (warm gradient) ───────── */
    [data-theme="sunset"] {
      --bg-image:    linear-gradient(150deg, #2d1b3d 0%, #5b2a4a 50%, #8c3a3a 100%);
      --bg:          #2d1b3d;
      --surface:     rgba(80, 35, 60, 0.55);
      --surface-2:   rgba(100, 50, 75, 0.5);
      --user-bg:     rgba(255, 140, 100, 0.2);
      --text:        #fff0ea;
      --text-muted:  #d8b0a8;
      --text-faint:  #a0807a;
      --accent:      #ff9070;
      --accent-hover:#e57050;
      --border:      rgba(255, 150, 120, 0.25);
      --shadow:      0 4px 24px rgba(180, 60, 60, 0.25);
    }

    /* ───────── MIDNIGHT (pure dark, subtle) ───────── */
    [data-theme="midnight"] {
      --bg-image:    none;
      --bg:          #0f0f10;
      --surface:     #1a1a1c;
      --surface-2:   #232325;
      --user-bg:     #2a2a2d;
      --text:        #f0f0f0;
      --text-muted:  #a8a8a8;
      --text-faint:  #6a6a6a;
      --accent:      #7c7cf8;
      --accent-hover:#6363e0;
      --border:      #2e2e30;
      --shadow:      0 2px 8px rgba(0,0,0,0.4);
    }

    /* ───────── FOREST (deep green) ───────── */
    [data-theme="forest"] {
      --bg-image:    linear-gradient(165deg, #0e1f17 0%, #142a20 100%);
      --bg:          #0e1f17;
      --surface:     rgba(25, 50, 38, 0.6);
      --surface-2:   rgba(35, 65, 50, 0.5);
      --user-bg:     rgba(80, 180, 130, 0.2);
      --text:        #e8f5ec;
      --text-muted:  #a0c8b0;
      --text-faint:  #608078;
      --accent:      #5fc88a;
      --accent-hover:#48ad70;
      --border:      rgba(95, 200, 138, 0.25);
      --shadow:      0 4px 24px rgba(40, 120, 80, 0.3);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      height: 100%;
      background: var(--bg);
      background-image: var(--bg-image);
      background-attachment: fixed;
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* ─────────────────────────────────────────────────────────────
       LAYOUT
       ───────────────────────────────────────────────────────────── */
    .app {
      display: flex; flex-direction: column;
      height: 100vh;
      max-width: 780px;
      margin: 0 auto;
    }

    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    header .title {
      font-weight: 600; font-size: 15px;
      display: flex; align-items: center; gap: 8px;
    }
    header .logo {
      width: 22px; height: 22px;
      background: var(--accent);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 700; font-size: 12px;
    }
    header .status {
      font-size: 12px; color: var(--text-muted);
      display: flex; align-items: center; gap: 6px;
    }
    header .status::before {
      content: ''; width: 6px; height: 6px;
      background: #9bb89b; border-radius: 50%;
    }
    header .status.offline::before { background: #cf6464; }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px 16px;
      scroll-behavior: smooth;
    }
    .chat::-webkit-scrollbar { width: 6px; }
    .chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .empty {
      text-align: center; color: var(--text-muted);
      margin-top: 30vh; font-size: 14px;
    }
    .empty .big {
      font-size: 24px; font-weight: 600; color: var(--text);
      margin-bottom: 8px;
    }

    /* ─────────────────────────────────────────────────────────────
       MESSAGES
       ───────────────────────────────────────────────────────────── */
    .msg { margin-bottom: 24px; animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    .msg.user { display: flex; justify-content: flex-end; }
    .msg.user .bubble {
      background: var(--user-bg);
      padding: 10px 14px;
      border-radius: 14px;
      max-width: 75%;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .msg.bot .content {
      padding: 0;
      color: var(--text);
    }
    .msg.bot .content p { margin: 0 0 0.6em; }
    .msg.bot .content p:last-child { margin-bottom: 0; }
    .msg.bot .content ul, .msg.bot .content ol {
      margin: 0.4em 0; padding-left: 1.4em;
    }
    .msg.bot .content li { margin: 0.2em 0; }
    .msg.bot .content strong { font-weight: 600; color: var(--text); }
    .msg.bot .content code {
      background: var(--surface-2);
      padding: 2px 6px; border-radius: 4px;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.9em;
    }
    .msg.bot .content pre {
      background: var(--surface-2);
      padding: 12px; border-radius: 8px;
      overflow-x: auto; margin: 0.6em 0;
    }
    .msg.bot .content pre code { background: none; padding: 0; }
    .msg.bot .content h1, .msg.bot .content h2, .msg.bot .content h3 {
      margin: 0.8em 0 0.3em; line-height: 1.3;
    }

    /* Streaming cursor */
    .cursor::after {
      content: '▌';
      display: inline-block;
      animation: blink 1s steps(2) infinite;
      color: var(--accent);
      margin-left: 2px;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* Loading dots before first token */
    .thinking {
      display: inline-flex; align-items: center; gap: 4px;
      color: var(--text-muted); font-size: 14px;
    }
    .thinking .dot {
      width: 6px; height: 6px; background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }
    .thinking .dot:nth-child(2) { animation-delay: 0.16s; }
    .thinking .dot:nth-child(3) { animation-delay: 0.32s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
      40%           { transform: scale(1);   opacity: 1; }
    }

    /* ─────────────────────────────────────────────────────────────
       META (response time + sources button)
       ───────────────────────────────────────────────────────────── */
    .meta {
      display: flex; align-items: center; gap: 12px;
      margin-top: 10px;
      font-size: 12px; color: var(--text-faint);
    }
    .meta .time { display: flex; align-items: center; gap: 4px; }
    .meta .sources-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 10px; border-radius: 999px;
      font-size: 12px; cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .meta .sources-btn:hover {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--text-faint);
    }
    .meta .sources-btn .count {
      background: var(--accent); color: white;
      border-radius: 999px;
      padding: 1px 6px; margin-left: 4px;
      font-size: 11px; font-weight: 500;
    }

    .sources-panel {
      margin-top: 10px;
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      animation: fadeIn 0.2s ease;
    }
    .sources-panel .label {
      font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--text-faint);
      margin-bottom: 8px;
    }
    .sources-panel .source {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 0;
      font-size: 13px; color: var(--text);
    }
    .sources-panel .source::before {
      content: '📄'; font-size: 14px;
    }

    /* ─────────────────────────────────────────────────────────────
       INPUT BAR
       ───────────────────────────────────────────────────────────── */
    .input-wrap {
      padding: 12px 20px 20px;
      background: var(--surface);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-top: 1px solid var(--border);
    }

    /* ───────── THEME SWITCHER ───────── */
    .theme-picker {
      background: var(--surface-2);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 8px;
      font-family: inherit; font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .theme-picker:hover { color: var(--text); border-color: var(--accent); }
    .theme-picker:focus { outline: none; border-color: var(--accent); }

    /* ───────── SIDEBAR (multi-chat history) ───────── */
    .layout { display: flex; height: 100vh; }
    .sidebar {
      width: 240px; flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      padding: 14px 10px;
      transition: transform 0.2s;
    }
    .sidebar h3 {
      margin: 8px 6px 12px;
      font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-faint);
    }
    .sidebar-new {
      background: var(--accent); color: white;
      border: none; border-radius: 8px;
      padding: 8px 12px; font-family: inherit; font-size: 13px;
      cursor: pointer; font-weight: 500;
      transition: background 0.15s;
      margin-bottom: 14px;
    }
    .sidebar-new:hover { background: var(--accent-hover); }
    .chat-list { flex: 1; overflow-y: auto; }
    .chat-list::-webkit-scrollbar { width: 4px; }
    .chat-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .chat-row {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 9px; margin-bottom: 2px;
      border-radius: 8px; cursor: pointer;
      transition: background 0.1s;
      font-size: 13px; color: var(--text-muted);
    }
    .chat-row:hover { background: var(--surface-2); color: var(--text); }
    .chat-row.active { background: var(--user-bg); color: var(--text); font-weight: 500; }
    .chat-row .chat-title {
      flex: 1; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .chat-row .del-btn {
      background: transparent; border: none;
      color: var(--text-faint); cursor: pointer;
      font-size: 16px; line-height: 1; padding: 2px 6px;
      opacity: 0; transition: opacity 0.15s;
      border-radius: 4px;
    }
    .chat-row:hover .del-btn { opacity: 1; }
    .chat-row .del-btn:hover { background: var(--border); color: var(--text); }

    /* Mobile: hide sidebar by default, toggle with hamburger */
    .sidebar-toggle {
      display: none;
      background: var(--surface-2); color: var(--text-muted);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 6px 10px; cursor: pointer; font-size: 14px;
    }
    @media (max-width: 720px) {
      .sidebar {
        position: fixed; left: 0; top: 0; bottom: 0; z-index: 10;
        transform: translateX(-100%);
        box-shadow: 4px 0 16px rgba(0,0,0,0.15);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-toggle { display: inline-flex; }
    }
    .input-row {
      display: flex; gap: 8px; align-items: flex-end;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      box-shadow: var(--shadow);
      transition: border-color 0.15s;
    }
    .input-row:focus-within {
      border-color: var(--accent);
    }
    #q {
      flex: 1; border: none; outline: none;
      background: transparent; color: var(--text);
      font-family: inherit; font-size: 15px;
      resize: none; min-height: 24px; max-height: 200px;
      line-height: 1.5;
    }
    #q::placeholder { color: var(--text-faint); }
    #send {
      background: var(--accent); color: white;
      border: none; cursor: pointer;
      width: 32px; height: 32px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    #send:hover:not(:disabled) { background: var(--accent-hover); }
    #send:disabled { background: var(--text-faint); cursor: not-allowed; }

    .hint {
      text-align: center;
      font-size: 11px; color: var(--text-faint);
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="layout">

<aside class="sidebar" id="sidebar">
  <button class="sidebar-new" id="newChatSide">+ New chat</button>
  <h3>Past conversations</h3>
  <div class="chat-list" id="chatList"></div>
</aside>

<div class="app">

  <header>
    <div class="title">
      <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">☰</button>
      <div class="logo">R</div>
      <span>RAG Chat</span>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <select id="themePicker" class="theme-picker" title="Change theme">
        <option value="claude">☀ Claude warm</option>
        <option value="purple">🟣 Purple gradient</option>
        <option value="cyber">⚡ Cyber neon</option>
        <option value="ocean">🌊 Deep ocean</option>
        <option value="sunset">🌅 Sunset</option>
        <option value="midnight">🌙 Midnight</option>
        <option value="forest">🌲 Forest</option>
      </select>
      <div class="status" id="status">connecting…</div>
    </div>
  </header>

  <div class="chat" id="chat">
    <div class="empty" id="empty">
      <div class="big">Ask your documents</div>
      <div>Hybrid retrieval + grounded answers with citations.</div>
    </div>
  </div>

  <div class="input-wrap">
    <div class="input-row">
      <textarea
        id="q"
        rows="1"
        placeholder="Ask anything about your documents..."
        autofocus
      ></textarea>
      <button id="send" title="Send">→</button>
    </div>
    <div class="hint">Press Enter to send · Shift+Enter for a new line</div>
  </div>

</div>

</div>

<script>
const API     = '';                    // same origin
const chat    = document.getElementById('chat');
const input   = document.getElementById('q');
const send    = document.getElementById('send');
const status  = document.getElementById('status');
const themePicker = document.getElementById('themePicker');
const sidebar       = document.getElementById('sidebar');
const sidebarToggle = document.getElementById('sidebarToggle');
const newChatSide   = document.getElementById('newChatSide');
const chatList      = document.getElementById('chatList');

// ─── Theme switcher (persisted via localStorage) ─────────────────
const savedTheme = localStorage.getItem('rag_theme') || 'claude';
document.documentElement.setAttribute('data-theme', savedTheme);
themePicker.value = savedTheme;
themePicker.addEventListener('change', (e) => {
  document.documentElement.setAttribute('data-theme', e.target.value);
  localStorage.setItem('rag_theme', e.target.value);
});

// ─── Multi-conversation memory (localStorage-backed) ─────────────
const CHATS_KEY      = 'rag_all_chats';
const CURRENT_KEY    = 'rag_current_chat';
const SUMMARIZE_AFTER = 8;
const KEEP_RECENT     = 4;

let allChats = {};
let currentChatId = null;

function loadAll() {
  try {
    allChats = JSON.parse(localStorage.getItem(CHATS_KEY) || '{}');
    currentChatId = localStorage.getItem(CURRENT_KEY) || null;
    if (!currentChatId || !allChats[currentChatId]) {
      const ids = Object.keys(allChats);
      currentChatId = ids[0] || null;
    }
  } catch { allChats = {}; currentChatId = null; }
}
function saveAll() {
  localStorage.setItem(CHATS_KEY, JSON.stringify(allChats));
  localStorage.setItem(CURRENT_KEY, currentChatId || '');
}
function current() { return currentChatId ? allChats[currentChatId] : null; }

function newChat() {
  const id = 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
  allChats[id] = {
    id, title: 'New chat',
    messages: [], summary: '',
    createdAt: Date.now(), lastActive: Date.now(),
  };
  currentChatId = id;
  saveAll();
  renderSidebar();
  renderEmptyChat();
}

function deleteChat(id) {
  delete allChats[id];
  if (currentChatId === id) currentChatId = Object.keys(allChats)[0] || null;
  saveAll();
  if (!currentChatId) newChat();
  else { renderSidebar(); rehydrate(); }
}

function switchChat(id) {
  if (!allChats[id]) return;
  currentChatId = id;
  saveAll();
  renderSidebar();
  rehydrate();
  if (window.innerWidth <= 720) sidebar.classList.remove('open');
}

function renderSidebar() {
  chatList.innerHTML = '';
  const sorted = Object.values(allChats).sort((a, b) => b.lastActive - a.lastActive);
  for (const c of sorted) {
    const row = document.createElement('div');
    row.className = 'chat-row' + (c.id === currentChatId ? ' active' : '');
    row.innerHTML = `<span class="chat-title"></span><button class="del-btn" title="Delete">×</button>`;
    row.querySelector('.chat-title').textContent = c.title || 'New chat';
    row.querySelector('.chat-title').onclick = () => switchChat(c.id);
    row.querySelector('.del-btn').onclick = (e) => {
      e.stopPropagation();
      if (confirm(`Delete "${c.title}"?`)) deleteChat(c.id);
    };
    chatList.appendChild(row);
  }
}

function renderEmptyChat() {
  chat.innerHTML = `
    <div class="empty">
      <div class="big">Ask your documents</div>
      <div>Hybrid retrieval + grounded answers with citations.</div>
    </div>`;
}

function rehydrate() {
  const c = current();
  if (!c || !c.messages.length) { renderEmptyChat(); return; }
  chat.innerHTML = '';
  for (const m of c.messages) {
    if (m.role === 'user') {
      const el = document.createElement('div');
      el.className = 'msg user';
      el.innerHTML = `<div class="bubble"></div>`;
      el.querySelector('.bubble').textContent = m.content;
      chat.appendChild(el);
    } else {
      const el = document.createElement('div');
      el.className = 'msg bot';
      el.innerHTML = `<div class="content"></div>`;
      el.querySelector('.content').innerHTML = marked.parse(m.content);
      chat.appendChild(el);
    }
  }
  setTimeout(() => { chat.scrollTop = chat.scrollHeight; }, 0);
}

async function maybeSummarize() {
  const c = current(); if (!c) return;
  if (c.messages.length <= SUMMARIZE_AFTER) return;
  const toSummarize = c.messages.slice(0, c.messages.length - KEEP_RECENT);
  const recent      = c.messages.slice(c.messages.length - KEEP_RECENT);
  try {
    const r = await fetch(API + '/summarize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: toSummarize, previous_summary: c.summary }),
    });
    if (!r.ok) return;
    const { summary } = await r.json();
    c.summary  = summary;
    c.messages = recent;
    saveAll();
  } catch {/* network blip */}
}

// ─── Initial load ────────────────────────────────────────────────
loadAll();
if (!currentChatId) newChat();
else { renderSidebar(); rehydrate(); }

// Sidebar toggle (mobile)
sidebarToggle.addEventListener('click', () => sidebar.classList.toggle('open'));
newChatSide.addEventListener('click', newChat);

// ─── API health check ────────────────────────────────────────────
fetch(API + '/health')
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(d => { status.textContent = d.model || 'online'; })
  .catch(() => {
    status.textContent = 'offline';
    status.classList.add('offline');
  });

// ─── Helpers ─────────────────────────────────────────────────────
function autoResize() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 200) + 'px';
}
input.addEventListener('input', autoResize);

function scrollDown() {
  chat.scrollTop = chat.scrollHeight;
}

function addUserMessage(text) {
  const empty = chat.querySelector('.empty');
  if (empty) empty.remove();
  const el = document.createElement('div');
  el.className = 'msg user';
  el.innerHTML = `<div class="bubble"></div>`;
  el.querySelector('.bubble').textContent = text;
  chat.appendChild(el);
  scrollDown();
}

function addBotMessage() {
  const el = document.createElement('div');
  el.className = 'msg bot';
  el.innerHTML = `
    <div class="content"><span class="thinking">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </span></div>
    <div class="meta" style="display:none">
      <span class="time"></span>
      <button class="sources-btn" style="display:none">Sources <span class="count"></span></button>
    </div>
    <div class="sources-panel" style="display:none"></div>
  `;
  chat.appendChild(el);
  scrollDown();
  return el;
}

function setBotText(msgEl, rawText) {
  const content = msgEl.querySelector('.content');
  content.innerHTML = marked.parse(rawText);
  // Append blinking cursor while streaming
  const last = content.lastElementChild || content;
  last.classList.add('cursor');
  scrollDown();
}

function finalizeBot(msgEl, rawText, firstTokenSec, totalSec, sources) {
  const content = msgEl.querySelector('.content');
  content.innerHTML = marked.parse(rawText);

  const meta    = msgEl.querySelector('.meta');
  const timeEl  = msgEl.querySelector('.time');
  const srcBtn  = msgEl.querySelector('.sources-btn');
  const srcPane = msgEl.querySelector('.sources-panel');
  const cntEl   = msgEl.querySelector('.count');

  meta.style.display = 'flex';
  timeEl.textContent = `⏱ ${firstTokenSec.toFixed(2)}s · ${totalSec.toFixed(2)}s total`;

  if (sources && sources.length) {
    srcBtn.style.display = 'inline-flex';
    cntEl.textContent    = sources.length;
    srcBtn.onclick = () => {
      const open = srcPane.style.display === 'block';
      srcPane.style.display = open ? 'none' : 'block';
      srcBtn.firstChild.textContent = open ? 'Sources ' : 'Hide sources ';
      if (!open) {
        srcPane.innerHTML = `<div class="label">Referenced documents</div>` +
          sources.map(s => `<div class="source">${s}</div>`).join('');
      }
    };
  }
  scrollDown();
}

// ─── Streaming SSE parser ────────────────────────────────────────
async function streamAnswer(query, msgEl) {
  const t0 = performance.now();
  let firstTokenAt = null;
  let answer       = '';
  let sources      = [];

  try {
    const c = current();
    const res = await fetch(API + '/answer/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        q:       query,
        top_k:   5,
        history: c ? c.messages : [],
        summary: c ? c.summary  : '',
      }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const events = buffer.split('\n\n');
      buffer = events.pop();

      for (const evt of events) {
        if (!evt.startsWith('data:')) continue;
        const payload = evt.slice(5).trim();
        if (payload === '[DONE]') continue;
        try {
          const msg = JSON.parse(payload);
          if (msg.type === 'token') {
            if (firstTokenAt === null) firstTokenAt = (performance.now() - t0) / 1000;
            answer += msg.text;
            setBotText(msgEl, answer);
          } else if (msg.type === 'sources') {
            sources = msg.sources || [];
          }
        } catch {/* ignore */}
      }
    }

    const total = (performance.now() - t0) / 1000;
    finalizeBot(msgEl, answer, firstTokenAt || total, total, sources);

    // Persist this turn + maybe compress older history
    const c2 = current();
    if (c2) {
      c2.messages.push({ role: 'assistant', content: answer });
      c2.lastActive = Date.now();
      saveAll();
      renderSidebar();
      maybeSummarize();
    }
  } catch (e) {
    msgEl.querySelector('.content').innerHTML =
      `<span style="color:#cf6464">Error: ${e.message}</span>`;
  }
}

// ─── Send handler ────────────────────────────────────────────────
async function handleSend() {
  const q = input.value.trim();
  if (!q || send.disabled) return;

  input.value = ''; autoResize();
  send.disabled = true;

  addUserMessage(q);
  // Save user turn + auto-title chat from first question
  const c = current();
  if (c) {
    c.messages.push({ role: 'user', content: q });
    c.lastActive = Date.now();
    if (c.title === 'New chat') {
      c.title = q.length > 40 ? q.slice(0, 40) + '…' : q;
    }
    saveAll();
    renderSidebar();
  }

  const botEl = addBotMessage();
  await streamAnswer(q, botEl);
  send.disabled = false;
  input.focus();
}

send.addEventListener('click', handleSend);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});
</script>
